<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水豚旅行 | 多人旅行记账与分摊</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="home">
  <main class="page-shell mobile-home stack">
    <header class="topbar home-topbar">
      <a class="brand" href="./index.html" aria-label="水豚旅行首页">
        <span class="brand-mark">
          <img src="./assets/hero-capybara.svg" alt="水豚旅行头像" />
        </span>
        <span class="brand-copy">
          <strong>水豚旅行</strong>
          <small>Capybara Trip</small>
        </span>
      </a>
    </header>

    <section class="home-composer" aria-label="水豚旅行介绍">
      <div class="home-intro">
        <span class="eyebrow">多人旅行记账与分摊工具</span>
        <h1>把旅行里最容易说不清的账，温柔地算清楚。</h1>
        <p>重点记录住宿、门票、聚餐、交通等共同大额支出。谁付款、谁参与、最后谁该补钱，一页看明白。</p>
      </div>

      <section class="guide-flow" aria-labelledby="guide_title">
        <div class="guide-flow-head">
          <span class="eyebrow">30 秒上手</span>
          <h2 id="guide_title">只需要三步</h2>
        </div>
        <div class="arrow-steps">
          <article>
            <span>第一步</span>
            <strong>创建行程</strong>
          </article>
          <span class="step-arrow" aria-hidden="true">→</span>
          <article>
            <span>第二步</span>
            <strong>记一笔</strong>
          </article>
          <span class="step-arrow" aria-hidden="true">→</span>
          <article>
            <span>第三步</span>
            <strong>看结算</strong>
          </article>
        </div>
      </section>

      <section class="home-action-row" aria-label="主要操作">
        <a class="action-tile primary" href="./create.html">
          <span>开始</span>
          <strong>创建行程</strong>
        </a>
        <a class="action-tile secondary" href="./manage.html">
          <span>继续</span>
          <strong>查看已有行程</strong>
        </a>
      </section>

      <section class="home-advantage-row" aria-label="产品优势">
        <article>
          <span>大额优先</span>
          <strong>不用记碎账</strong>
          <p>只记真正影响结算的大项。</p>
        </article>
        <article>
          <span>可复盘</span>
          <strong>分类占比清楚</strong>
          <p>看清钱主要花在哪。</p>
        </article>
        <article>
          <span>适合场景</span>
          <strong>朋友旅行、团建、家庭出游</strong>
          <p>多人共同支出更容易说清。</p>
        </article>
      </section>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
