<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水豚旅行 | 多人旅行记账与分摊</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="home">
  <main class="page-shell mobile-home travel-board stack">
    <header class="topbar home-topbar">
      <a class="brand" href="./index.html" aria-label="水豚旅行首页">
        <span class="brand-mark">
          <img src="./assets/hero-capybara.svg" alt="水豚旅行头像" />
        </span>
        <span class="brand-copy">
          <strong>水豚旅行</strong>
          <small>Capybara Trip</small>
        </span>
      </a>
      <span class="home-mini-badge">多人旅行记账与分摊</span>
    </header>

    <section class="travel-board-panel" aria-label="旅行记账工具面板">
      <section class="travel-color-grid" aria-label="共同支出类型">
        <article class="color-card coral">
          <span class="feature-icon">🏨</span>
          <strong>住宿</strong>
        </article>
        <article class="color-card amber">
          <span class="feature-icon">🎫</span>
          <strong>门票</strong>
        </article>
        <article class="color-card blue">
          <span class="feature-icon">🍲</span>
          <strong>聚餐</strong>
        </article>
        <article class="color-card violet">
          <span class="feature-icon">🚗</span>
          <strong>交通</strong>
        </article>
        <article class="color-card teal">
          <span class="feature-icon">🧾</span>
          <strong>结算</strong>
        </article>
      </section>

      <section class="travel-icon-grid" aria-label="主要功能入口">
        <a class="tool-entry" href="./create.html">
          <span class="tool-icon orange">＋</span>
          <strong>创建行程</strong>
        </a>
        <a class="tool-entry" href="./manage.html">
          <span class="tool-icon gold">📒</span>
          <strong>查看已有行程</strong>
        </a>
        <button class="tool-entry" type="button" onclick="window.alert('先选择一个已有行程，再进入「记一笔」。')">
          <span class="tool-icon sky">✎</span>
          <strong>记一笔</strong>
        </button>
        <button class="tool-entry" type="button" onclick="window.alert('先选择一个已有行程，再进入「增加预算」。')">
          <span class="tool-icon purple">¥</span>
          <strong>增加预算</strong>
        </button>
        <button class="tool-entry" type="button" onclick="window.alert('先选择一个已有行程，再查看结算。')">
          <span class="tool-icon green">✓</span>
          <strong>查看结算</strong>
        </button>
      </section>

      <section class="coverage-strip" aria-label="覆盖场景">
        <span>🏨</span>
        <span>🎫</span>
        <span>🍲</span>
        <span>🚗</span>
        <strong>住宿 / 门票 / 聚餐 / 交通 + 共同支出</strong>
      </section>

      <section class="bottom-tool-grid" aria-label="产品优势">
        <article>
          <strong>大额优先</strong>
          <span>不用记碎账</span>
        </article>
        <article>
          <strong>分类占比</strong>
          <span>钱花在哪</span>
        </article>
        <article>
          <strong>转账路径</strong>
          <span>谁该付谁</span>
        </article>
        <article>
          <strong>水豚拍板</strong>
          <span>少点纠结</span>
        </article>
        <article>
          <strong>适合场景</strong>
          <span>朋友/团建/家庭</span>
        </article>
      </section>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
