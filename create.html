<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择记账模式 | 水豚旅行</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="choose">
  <main class="page-shell stack">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="水豚旅行首页">
        <span class="brand-mark">
          <img src="./assets/hero-capybara.svg" alt="水豚旅行头像" />
        </span>
        <span class="brand-copy">
          <strong>选择模式</strong>
          <small>Choose Mode</small>
        </span>
      </a>
      <nav class="nav-actions" aria-label="页面导航">
        <a class="btn ghost" href="./index.html">返回首页</a>
      </nav>
    </header>

    <section class="page-intro compact-intro mode-intro">
      <div>
        <span class="eyebrow">创建行程前</span>
        <h1 class="page-title">先选择这趟旅行怎么记账。</h1>
      </div>
    </section>

    <section class="mode-choice-list mode-choice-row" aria-label="选择记账模式">
      <a class="mode-choice-card" href="./create-parent.html">
        <span class="badge">大家长模式</span>
        <h2 class="section-title">一个人统一管钱</h2>
        <p class="meta-text">适合先收预算、统一垫付，最后看谁该退、谁该补。</p>
      </a>

      <a class="mode-choice-card" href="./create-shared.html">
        <span class="badge">多人付款模式</span>
        <h2 class="section-title">谁付款就记谁</h2>
        <p class="meta-text">适合大家轮流付款，最后直接生成转账路径。</p>
      </a>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
