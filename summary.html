<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水豚旅行 · 结算总结</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="summary">
  <main class="page-shell stack">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">
          <img src="./assets/hero-capybara.svg" alt="水豚旅行头像" />
        </span>
        <span class="brand-copy">
          <strong id="summary_title">结算总结</strong>
          <small>Trip Summary</small>
        </span>
      </div>
      <nav class="nav-actions">
        <a class="btn ghost" id="summary_back_detail" href="./detail.html">返回详情</a>
        <a class="btn secondary" href="./archive.html">查看存档</a>
      </nav>
    </header>

    <section class="card soft">
      <span class="eyebrow">Review Snapshot</span>
      <h1 class="page-title" id="summary_heading">正在加载...</h1>
      <p class="section-copy" id="summary_info">请稍候。</p>
      <div class="metrics-grid" id="summary_metrics"></div>
    </section>

    <section class="review-grid">
      <article class="card">
        <span class="eyebrow">Category Share</span>
        <h2 class="section-title">各分类支出占比</h2>
        <div id="category_share_list" class="settlement-list"></div>
      </article>

      <article class="card dark">
        <span class="eyebrow">Poster Line</span>
        <h2 class="section-title">催款大字报</h2>
        <p class="poster-line" id="review_poster_line">正在生成文案...</p>
      </article>
    </section>

    <section class="card">
      <span class="eyebrow">Settlement</span>
      <h2 class="section-title">最终结算</h2>
      <div id="settlement_view" class="settlement-list"></div>
    </section>

    <section class="card">
      <span class="eyebrow">Expense Breakdown</span>
      <h2 class="section-title">支出拆解</h2>
      <div id="spend_list" class="expense-list"></div>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
