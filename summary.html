<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>结算总结 | 水豚旅行</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="summary">
  <main class="page-shell stack">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="水豚旅行首页">
        <span class="brand-mark">
          <img src="./assets/hero-capybara.svg" alt="水豚旅行头像" />
        </span>
        <span class="brand-copy">
          <strong id="summary_title">结算总结</strong>
          <small>Trip Summary</small>
        </span>
      </a>
      <nav class="nav-actions" aria-label="页面导航">
        <a class="btn primary" id="summary_back_detail" href="./detail.html">继续记账</a>
        <a class="btn secondary" href="./manage.html">查看已有行程</a>
      </nav>
    </header>

    <section class="page-intro">
      <div>
        <span class="eyebrow">结算总结</span>
        <h1 class="page-title" id="summary_heading">正在加载...</h1>
        <p class="section-copy" id="summary_info">请稍等。</p>
      </div>
    </section>

    <section class="metrics-grid" id="summary_metrics"></section>

    <section class="review-grid">
      <article class="panel">
        <span class="eyebrow">分类占比</span>
        <h2 class="section-title">钱主要花在哪</h2>
        <div id="category_share_list" class="settlement-list"></div>
      </article>

      <article class="panel dark-panel">
        <span class="eyebrow">提醒文案</span>
        <h2 class="section-title">可以直接发群里</h2>
        <p class="poster-line" id="review_poster_line">正在生成文案...</p>
      </article>
    </section>

    <section class="panel">
      <span class="eyebrow">最终结算</span>
      <h2 class="section-title">谁该付给谁</h2>
      <div id="settlement_view" class="settlement-list"></div>
    </section>

    <section class="panel">
      <span class="eyebrow">支出拆解</span>
      <h2 class="section-title">每笔支出明细</h2>
      <div id="spend_list" class="expense-list"></div>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
