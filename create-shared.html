<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多人付款模式 | 水豚旅行</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="create" data-default-mode="shared">
  <main class="page-shell stack">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="水豚旅行首页">
        <span class="brand-mark">
          <img src="./assets/hero-capybara.svg" alt="水豚旅行头像" />
        </span>
        <span class="brand-copy">
          <strong>多人付款模式</strong>
          <small>Shared Mode</small>
        </span>
      </a>
      <nav class="nav-actions" aria-label="页面导航">
        <a class="btn ghost" href="./create.html">重新选择</a>
        <a class="btn secondary" href="./manage.html">已有行程</a>
      </nav>
    </header>

    <section class="page-intro">
      <div>
        <span class="eyebrow">谁付款就记谁</span>
        <h1 class="page-title">适合大家轮流付款的旅行。</h1>
        <p class="section-copy">创建后进入记账页，每笔支出填写付款人和参与人，结算时自动生成转账路径。</p>
      </div>
    </section>

    <section class="form-layout single-form">
      <article class="panel">
        <form id="create_form" class="field-list">
          <div class="field">
            <label for="trip_name">行程名称</label>
            <input class="input" id="trip_name" name="trip_name" type="text" maxlength="24" placeholder="例如：周末露营局" />
          </div>

          <p class="hint" id="mode_hint">多人各自付款，系统会按付款人和参与人生成最终转账路径。</p>

          <div class="field">
            <div class="split-actions">
              <span class="field-title">成员</span>
              <button class="btn secondary" id="add_person_btn" type="button">添加成员</button>
            </div>
            <div id="people_fields" class="field-list"></div>
          </div>

          <div class="field" id="manager_field" hidden>
            <label for="manager_select">大家长</label>
            <select class="select" id="manager_select" name="manager_select"></select>
          </div>

          <div class="field">
            <label for="budget_input" id="budget_label">行程总预算</label>
            <input class="input" id="budget_input" name="budget_input" type="number" min="0" step="0.01" placeholder="输入这趟旅行总预算" />
            <p class="hint" id="budget_hint">多人付款模式会把总预算换算成人均参考值。</p>
          </div>

          <button class="btn primary full-width" type="submit">保存并进入记账页</button>
          <div id="create_message" class="message" aria-live="polite"></div>
        </form>
      </article>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
