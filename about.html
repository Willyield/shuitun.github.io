<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>产品介绍 | 水豚旅行</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="about">
  <main class="page-shell stack">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="水豚旅行首页">
        <span class="brand-mark">
          <img src="./assets/hero-capybara.svg" alt="水豚旅行头像" />
        </span>
        <span class="brand-copy">
          <strong>产品介绍</strong>
          <small>About</small>
        </span>
      </a>
      <nav class="nav-actions" aria-label="页面导航">
        <a class="btn ghost" href="./index.html">返回首页</a>
        <a class="btn primary" href="./create.html">开始使用</a>
      </nav>
    </header>

    <section class="page-intro">
      <span class="eyebrow">What It Does</span>
      <h1 class="page-title">水豚旅行是一个多人旅行记账与分摊工具。</h1>
      <p class="section-copy">它专门处理住宿、门票、聚餐、交通这类共同支出，减少旅行结束后的算账沟通成本。</p>
    </section>

    <section class="about-grid">
      <article class="about-item">
        <span class="badge">创建行程</span>
        <h2 class="section-title">先定成员和预算</h2>
        <p class="meta-text">选择大家长模式或多人付款模式，再进入详情页记账。</p>
      </article>
      <article class="about-item">
        <span class="badge">记一笔</span>
        <h2 class="section-title">记录付款人和参与人</h2>
        <p class="meta-text">每笔支出都能明确是谁付的、谁参与分摊。</p>
      </article>
      <article class="about-item">
        <span class="badge">看结算</span>
        <h2 class="section-title">自动生成结果</h2>
        <p class="meta-text">系统会给出分类占比、支出拆解和最终转账路径。</p>
      </article>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
