<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>增加预算 | 水豚旅行</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="budget">
  <main class="page-shell stack">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="水豚旅行首页">
        <span class="brand-mark">
          <img src="./assets/hero-capybara.svg" alt="水豚旅行头像" />
        </span>
        <span class="brand-copy">
          <strong id="budget_title">增加预算</strong>
          <small>Add Budget</small>
        </span>
      </a>
      <nav class="nav-actions" aria-label="页面导航">
        <a class="btn ghost" id="budget_back_link" href="./manage.html">返回行程</a>
      </nav>
    </header>

    <section class="panel budget-add-panel">
      <span class="eyebrow">预算</span>
      <h1 class="page-title">增加预算</h1>
      <form id="budget_form" class="field-list">
        <div class="field">
          <label for="budget_append_input">追加金额</label>
          <input class="input" id="budget_append_input" type="number" min="0" step="0.01" placeholder="输入要补充的金额" />
        </div>
        <p class="section-copy" id="budget_append_hint">追加后会同步刷新当前预算进度。</p>
        <button class="btn secondary full-width" type="submit">增加预算</button>
        <div id="detail_message" class="message" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
